# Scene list for the Starship Flight 15 reference video (timestamps only, no image data).
# Used by tools/frames2text/frames2text.py; see aidocs/starship/reference_tooling.md.
#
# Video: "Starship Flight 15 launch, ship catch _26 CNNs first reactions.mp4"
# (854x480, 29.97 fps, 493 s; local only, never committed). The SpaceX footage
# ends at 244.04 s; CNN coverage follows.
#
# Cut times come from ffmpeg scene detection (select='gt(scene,0.10)') plus 1 s
# frame checks where the shot changes without a hard cut (liftoff -> ascent,
# hot staging -> coast). Scenes 7 (split-screen booster) and 8 (booster landing
# burn and splash) are dropped. Scene 9 occurs twice (179.11-183.25 and
# 188.12-191.69, around the splash); the first stretch is used.
#
# Each scene plays (end - start) / speed seconds; the list totals about 60 s.

[[scene]]  # pad wide shot (0-11.01), then the aerial camera (11.01-18): tower, smoke, flames
name = "liftoff"
start = 0.0
end = 18.0
speed = 1.8        # 10.0 s

[[scene]]  # camera tilts up to the coastline, then a small rocket and plume in a blue sky
name = "ascent"
start = 18.0
end = 37.4
speed = 3.2        # 6.1 s

[[scene]]  # onboard: S42 hull with hex tiles, engine fire, coast far below (cut at 37.47)
name = "onboard"
start = 37.5
end = 67.25
speed = 5.0        # 6.0 s

[[scene]]  # dark sky, glowing pink/white plume (cut at 67.30)
name = "high_altitude"
start = 67.35
end = 77.5
speed = 3.4        # 3.0 s

[[scene]]  # flash at ~79 s (T+2:27), flames peak ~80 s, booster falls away by ~85 s (cut at 77.58)
name = "hot_staging"
start = 77.6
end = 85.0
speed = 1.5        # 4.9 s

[[scene]]  # same onboard shot: Earth limb, blue atmosphere, sun glare, ice particles
name = "coast"
start = 85.0
end = 124.3
speed = 6.5        # 6.0 s

[[scene]]  # ship over Earth, bright sun, black space (cut at 179.11)
name = "ship_over_earth"
start = 179.15
end = 183.2
speed = 1.0        # 4.1 s

[[scene]]  # SECO: plume blooms into blue-white haze, then clears (cut at 191.69)
name = "seco"
start = 191.75
end = 219.9
speed = 4.0        # 7.0 s

[[scene]]  # return: wide shot of two towers (220.09), ship descends beside the tower (223.72),
           # top-down close-up in the arms (231.53), wide shot of the caught ship (236.47)
name = "catch"
start = 220.15
end = 244.0
speed = 1.8        # 13.3 s
